# Every push and pull request: types, lint, then each package's tests on their own (so a
# package that only passes thanks to its neighbours is caught), and the app's tests.
name: CI

on:
  push:
    branches: [master, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ["@structura/core", "@structura/markush", "@structura/engine", "@structura/ai", "@structura/rdkit", "@structura/testkit", "app"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test ${{ matrix.suite }}
        run: |
          if [ "${{ matrix.suite }}" = "app" ]; then npm run test:app; else npm test -w "${{ matrix.suite }}"; fi

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    # Playwright's own image has the browser and its system libraries already: nothing to download.
    # Its version must match @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          HOME: /root
      - name: Keep the report, screenshots and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            test-results
          retention-days: 7
