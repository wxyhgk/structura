<!doctype html>
<!--
  Molecules shown on a page, each opening in the editor on a click. Each card holds its
  structure in the HTML (a molfile, or a Structura document for a generic formula), drawn as
  SVG by the same file that holds the editor (dist/standalone.js). 保存 redraws the card and
  hands the result to saveMolecule(), the one place a real page would send it to its server;
  here it is kept in this browser, so edits survive a reload (重置示例 forgets them).
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structura：页面里的分子，点击编辑</title>
    <link rel="stylesheet" href="../dist/style.css" />
    <style>
      .page { margin: 0 auto; max-width: 1100px; padding: 24px 16px 48px; font-family: system-ui, sans-serif; color: #222; }
      .page-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px; }
      .page-head h1 { margin: 0; font-size: 22px; }
      .page-head p { margin: 0; color: #666; font-size: 14px; flex: 1; }
      .link { background: none; border: 0; padding: 0; color: #2563eb; cursor: pointer; font-size: 13px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

      .molecule, .add-card { margin: 0; position: relative; border: 1px solid #e3e3e3; border-radius: 10px; background: #fff; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
      .molecule:hover, .add-card:hover, .molecule:focus-visible, .add-card:focus-visible { border-color: #2563eb; box-shadow: 0 2px 12px rgb(37 99 235 / 0.12); outline: none; }
      .molecule .picture { height: 180px; display: flex; align-items: center; justify-content: center; padding: 12px; }
      .molecule .picture svg { max-width: 100%; max-height: 100%; width: auto; height: auto; }
      .molecule .empty { color: #999; font-size: 13px; }
      .molecule .caption { border-top: 1px solid #f0f0f0; padding: 10px 14px; font-size: 13px; }
      .molecule .name { font-weight: 600; font-size: 14px; }
      .molecule .facts { color: #666; margin-top: 2px; }
      .molecule .hint { position: absolute; top: 8px; right: 10px; font-size: 12px; color: #2563eb; opacity: 0; transition: opacity 0.15s; }
      .molecule:hover .hint, .molecule:focus-visible .hint { opacity: 1; }
      .molecule.saved { animation: saved 1.2s ease-out; }
      @keyframes saved { from { box-shadow: 0 0 0 4px rgb(34 197 94 / 0.45); } to { box-shadow: 0 0 0 4px rgb(34 197 94 / 0); } }
      .add-card { min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #2563eb; font-size: 14px; border-style: dashed; }
      .add-card .plus { font-size: 32px; line-height: 1; }

      /* The editing sheet sits under the editor's own menus and dialogs (z-index 50), which open over it. */
      #sheet { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.4); display: flex; padding: 3vh 3vw; }
      #sheet[hidden] { display: none; }
      .sheet-panel { flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgb(0 0 0 / 0.3); }
      .sheet-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #ddd; font-family: system-ui, sans-serif; font-size: 14px; }
      .sheet-bar .title { font-weight: 600; flex: 1; }
      .sheet-bar .changed { color: #b45309; font-size: 12px; }
      .btn { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
      .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
      #sheet-editor { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="page-head">
        <h1>化合物</h1>
        <p>点击任意一个分子进入编辑器修改，保存后这里的图跟着更新。</p>
        <button class="link" id="reset" type="button">重置示例</button>
      </div>

      <div class="add-card" id="add" role="button" tabindex="0"><span class="plus">+</span>添加分子</div>
      </div>
    </main>

    <div id="sheet" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-bar">
          <span class="title" id="sheet-title"></span>
          <span class="changed" id="sheet-changed" hidden>有未保存的修改</span>
          <button class="btn" id="cancel" type="button">取消</button>
          <button class="btn primary" id="save" type="button">保存</button>
        </div>
        <div id="sheet-editor"></div>
      </div>
    </div>

    <script type="module">
      import { drawingFromMolfile, drawingSvg, mount, plainFormula, molecularWeight, readDocument, toDocument } from "../dist/standalone.js"

      const STORE = "structura-example-gallery"
      const cards = document.getElementById("cards")
      const sheet = document.getElementById("sheet")
      const changedNote = document.getElementById("sheet-changed")

      /**
       * Where a real page sends a saved molecule: its server, a form field… The molfile is
       * what other software reads; the Structura document also keeps a generic formula's
       * variables. Here: kept in this browser.
       */
      function saveMolecule(name, { molfile, document }) {
        console.log(`保存「${name}」`, { molfile, document })
        const saved = loadSaved()
        saved[name] = document
        try {
          localStorage.setItem(STORE, JSON.stringify(saved))
        } catch {
          // Storage refused (a private window): the page still shows the edit until it is reloaded.
        }
      }

      function loadSaved() {
        try {
          return JSON.parse(localStorage.getItem(STORE) ?? "{}")
        } catch {
          return {}
        }
      }

      /** Each card's structure as a Structura document, read from what the HTML holds. */
      const documents = new Map()

      function documentFromCard(card) {
        const saved = loadSaved()[card.dataset.name]
        if (saved) return saved
        const data = card.querySelector("script")
        if (!data) return toDocument(drawingFromMolfile("").drawing)
        if (data.type === "application/vnd.structura+json") return data.textContent.trim()
        return toDocument(drawingFromMolfile(data.textContent.replace(/^\n/, "")).drawing)
      }

      /** Draws a card from its document: the picture, the name, the formula and the weight. */
      function render(card) {
        const read = readDocument(documents.get(card))
        const drawing = "drawing" in read ? read.drawing : null
        const svg = drawing ? drawingSvg(drawing) : ""
        const formula = drawing && drawing.molecule.atoms.length > 0 ? plainFormula(drawing.molecule) : ""
        const isGeneric = drawing?.variables && Object.keys(drawing.variables).length > 0
        const facts = !formula ? "空" : isGeneric ? `通式 · ${Object.keys(drawing.variables).join("、")}` : `${formula} · ${molecularWeight(drawing.molecule).toFixed(2)}`
        for (const old of card.querySelectorAll(":scope > :not(script)")) old.remove()
        card.insertAdjacentHTML(
          "beforeend",
          `<div class="picture">${svg || '<span class="empty">（空）</span>'}</div>
           <figcaption class="caption"><div class="name"></div><div class="facts"></div></figcaption>
           <span class="hint">点击编辑</span>`,
        )
        card.querySelector(".name").textContent = card.dataset.name
        card.querySelector(".facts").textContent = facts
        card.tabIndex = 0
        card.setAttribute("role", "button")
        card.setAttribute("aria-label", `编辑 ${card.dataset.name}`)
      }

      function setUp(card, text = documentFromCard(card)) {
        documents.set(card, text)
        render(card)
        card.addEventListener("click", () => openEditor(card))
        card.addEventListener("keydown", (event) => (event.key === "Enter" || event.key === " ") && (event.preventDefault(), openEditor(card)))
      }

      // ---- The editing sheet: one editor at a time, mounted on open and removed on close.

      let editing = null // { card, editor, changed }

      function openEditor(card) {
        if (editing) return
        sheet.hidden = false
        document.body.style.overflow = "hidden"
        document.getElementById("sheet-title").textContent = card ? `编辑：${card.dataset.name}` : "添加分子"
        changedNote.hidden = true
        const editor = mount("#sheet-editor", {
          initialDocument: card ? documents.get(card) : undefined,
          onDocumentChange() {
            editing.changed = true
            changedNote.hidden = false
          },
        })
        editing = { card, editor, changed: false }
        window.editor = editor
      }

      function closeEditor() {
        editing.editor.unmount()
        editing = null
        delete window.editor
        sheet.hidden = true
        document.body.style.overflow = ""
      }

      /** A card for a molecule the page did not start with, before the 添加分子 card. */
      function addCard(name, text) {
        const card = document.createElement("figure")
        card.className = "molecule"
        card.dataset.name = name
        cards.insertBefore(card, document.getElementById("add"))
        setUp(card, text)
        return card
      }

      function save() {
        const { card, editor } = editing
        const text = editor.getDocument()
        const read = readDocument(text)
        const empty = "drawing" in read && read.drawing.molecule.atoms.length === 0
        if (!card && empty) return closeEditor()
        let target = card
        if (!target) {
          const name = prompt("给这个分子起个名字", `化合物 ${cards.querySelectorAll(".molecule").length + 1}`)
          if (name === null) return
          target = addCard(name.trim() || "未命名", text)
        } else {
          documents.set(target, text)
          render(target)
        }
        saveMolecule(target.dataset.name, { molfile: editor.getMolfile(), document: text })
        closeEditor()
        target.classList.remove("saved")
        void target.offsetWidth
        target.classList.add("saved")
      }

      function cancel() {
        if (editing.changed && !confirm("修改还没保存，确定放弃吗？")) return
        closeEditor()
      }

      document.getElementById("save").addEventListener("click", save)
      document.getElementById("cancel").addEventListener("click", cancel)
      document.getElementById("add").addEventListener("click", () => openEditor(null))
      document.getElementById("add").addEventListener("keydown", (event) => event.key === "Enter" && openEditor(null))
      document.getElementById("reset").addEventListener("click", () => {
        try {
          localStorage.removeItem(STORE)
        } catch {}
        location.reload()
      })

      for (const card of cards.querySelectorAll(".molecule")) setUp(card)
      // Molecules added on an earlier visit.
      const onPage = new Set([...cards.querySelectorAll(".molecule")].map((card) => card.dataset.name))
      for (const [name, text] of Object.entries(loadSaved())) if (!onPage.has(name)) addCard(name, text)
    </script>
  </body>
</html>
