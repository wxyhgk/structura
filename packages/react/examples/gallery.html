<!doctype html>
<!--
  Molecules on a page with <chem-molecule>: each shows its structure, and with `editable` a
  click opens the editor over the page; 保存 updates it and fires `change`. The structure comes
  from a child <script> (a molfile, or a Structura document for a generic formula) or from
  `smiles`. The script below only writes the captions and keeps edits in this browser, so they
  survive a reload (重置示例 forgets them); a real page would send them to its server instead.
  One <script> and one stylesheet; from npm:
  https://cdn.jsdelivr.net/npm/chem-structura@<version>/dist/chem-structura.iife.js and …/dist/style.css
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structura：页面里的分子，点击编辑</title>
    <link rel="stylesheet" href="../dist/style.css" />
    <script src="../dist/chem-structura.iife.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #222; }
      main { margin: 0 auto; max-width: 1100px; padding: 24px 16px 48px; }
      .head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px; }
      .head h1 { margin: 0; font-size: 22px; }
      .head p { margin: 0; color: #666; font-size: 14px; flex: 1; }
      .link { background: none; border: 0; padding: 0; color: #2563eb; cursor: pointer; font-size: 13px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
      figure { margin: 0; border: 1px solid #e3e3e3; border-radius: 10px; overflow: hidden; background: #fff; }
      figure chem-molecule { display: block; height: 180px; padding: 12px; box-sizing: border-box; outline-offset: -4px; }
      figcaption { border-top: 1px solid #f0f0f0; padding: 10px 14px; font-size: 13px; }
      figcaption b { display: block; font-size: 14px; }
      .facts { color: #666; }
      h2 { font-size: 17px; margin: 40px 0 12px; }
      form { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      form chem-molecule { width: 220px; height: 140px; border: 1px dashed #bbb; border-radius: 8px; }
      #submitted { width: 100%; max-height: 160px; overflow: auto; background: #f6f6f6; padding: 8px; font-size: 12px; }
    </style>
  </head>

      <h2>在表单里</h2>
      <form id="form">
        <chem-molecule name="structure" editable label="要提交的结构"></chem-molecule>
        <button type="submit">提交</button>
        <button type="reset">重置</button>
        <pre id="submitted">提交后，这里显示表单带上的 structure 字段（MOL 文本）。</pre>
      </form>
    </main>

    <script>
      const { molecularWeight, plainFormula, readDocument } = ChemStructura
      const STORE = "structura-example-molecules"

      function saved() {
        try {
          return JSON.parse(localStorage.getItem(STORE) ?? "{}")
        } catch {
          return {}
        }
      }

      /** The caption under a card: formula and weight, or the variables of a generic formula. */
      function caption(molecule) {
        const facts = molecule.closest("figure")?.querySelector(".facts")
        if (!facts || !molecule.hasAttribute("editable")) return
        const read = readDocument(molecule.document)
        if (!("drawing" in read)) return
        const { molecule: mol, variables } = read.drawing
        const names = Object.keys(variables ?? {})
        facts.textContent = mol.atoms.length === 0 ? "空" : names.length > 0 ? `通式 · ${names.join("、")}` : `${plainFormula(mol)} · ${molecularWeight(mol).toFixed(2)}`
      }

      for (const molecule of document.querySelectorAll(".cards chem-molecule")) {
        molecule.addEventListener("load", () => {
          // An edit from an earlier visit replaces what the page holds.
          const kept = saved()[molecule.getAttribute("label")]
          if (kept) molecule.document = kept
          caption(molecule)
        })
        molecule.addEventListener("change", (event) => {
          caption(molecule)
          // event.detail: { molfile, document }. A real page would send it to its server here.
          try {
            localStorage.setItem(STORE, JSON.stringify({ ...saved(), [molecule.getAttribute("label")]: event.detail.document }))
          } catch {}
        })
      }

      document.getElementById("reset").addEventListener("click", () => {
        try {
          localStorage.removeItem(STORE)
        } catch {}
        location.reload()
      })

      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault()
        document.getElementById("submitted").textContent = new FormData(event.target).get("structure") || "（空）"
      })
    </script>
  </body>
</html>
